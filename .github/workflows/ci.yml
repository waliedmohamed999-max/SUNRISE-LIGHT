name: CI

on:
  push:
    branches: [master, "security/**"]
  # pull_request (not pull_request_target): forked PRs run without repository secrets
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # build-time placeholders only — no real database or secrets are used in CI
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      APP_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Secret scan (tracked files)
        run: node scripts/check-secrets.mjs
      - run: npx prisma generate
      - name: Lint
        run: npx eslint . --quiet
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit & security tests
        run: npx vitest run
      - name: Dependency audit (production, fails on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Production build
        run: npm run build
